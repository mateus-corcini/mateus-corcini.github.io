<style>
/* Layout: currículo como página única — cabeçalho fixo, herói com "whoami" e painel de status, depois seções em coluna larga com rótulo à esquerda */
:root{
  --paper:#F2F4F7; --sheet:#FFFFFF; --ink:#0E1A2B; --sub:#4F5E70; --rule:#D3DAE3;
  --cobalt:#2244C2; --cobalt-wash:#E4E9FA; --on-cobalt:#FFFFFF; --hi:#9A5B00; --hi-wash:#FBEFD9; --ok:#17784A; --ok-wash:#DDF1E6;

  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0B1220; --sheet:#121B2C; --ink:#E6ECF5; --sub:#97A5B8; --rule:#24324A;
  --cobalt:#93A9FF; --cobalt-wash:#1A2649; --on-cobalt:#0B1220; --hi:#F0B357; --hi-wash:#33260F; --ok:#5ECB92; --ok-wash:#13301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1220; --sheet:#121B2C; --ink:#E6ECF5; --sub:#97A5B8; --rule:#24324A;
  --cobalt:#93A9FF; --cobalt-wash:#1A2649; --on-cobalt:#0B1220; --hi:#F0B357; --hi-wash:#33260F; --ok:#5ECB92; --ok-wash:#13301F; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.08;text-wrap:balance}
p{margin:0}
a{color:var(--cobalt);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px;border-radius:2px}
.mono{font-family:var(--f-mono)}
.lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--paper)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
.mark{font-family:var(--f-display);font-weight:900;font-stretch:125%;font-size:20px;text-decoration:none;color:var(--ink);letter-spacing:-.01em}
.mark span{color:var(--cobalt)}
nav.links{display:flex;gap:18px;margin-left:auto;font-size:14px}
nav.links a{color:var(--sub);text-decoration:none}
nav.links a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--sub);font:600 12px var(--f-mono);padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:end;padding-block:56px 48px}
.whoami{font-family:var(--f-mono);font-size:14px;color:var(--sub)}
.whoami b{color:var(--cobalt);font-weight:500}
.hero h1{font-size:clamp(44px,8vw,96px);font-weight:900;font-stretch:125%;letter-spacing:-.025em;text-transform:uppercase;line-height:.9;margin-top:14px}
.hero h1 span{display:block;color:var(--cobalt)}
.role{font-family:var(--f-display);font-size:clamp(18px,2.2vw,22px);font-weight:600;font-stretch:105%;margin-top:18px}
.summary{color:var(--sub);max-width:60ch;margin-top:14px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--cobalt);background:var(--cobalt);color:var(--on-cobalt);padding:10px 16px;border-radius:4px;font-weight:600;font-size:14.5px;text-decoration:none;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--cobalt)}
.status{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.status .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule);font-family:var(--f-mono);font-size:12px;color:var(--sub)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-wash)}
.status dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0}
.status dt,.status dd{padding:10px 14px;border-bottom:1px solid var(--rule);margin:0;font-size:14.5px}
.status dt{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);padding-top:12px}
.status dl > :nth-last-child(-n+2){border-bottom:0}

/* sections */
section.sec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;padding-block:44px;border-top:2px solid var(--ink);scroll-margin-top:70px}
.sec h2{font-size:28px;font-weight:800;font-stretch:112%}
.sec .side{display:flex;flex-direction:column;gap:6px}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 32px}
.skills h3{font-size:15px;font-family:var(--f-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:3px 9px;font-size:14px}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;padding-bottom:26px;margin-bottom:26px;border-bottom:1px solid var(--rule)}
.job:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.job h3{font-size:21px;font-stretch:105%}
.job .org{color:var(--cobalt);font-weight:600}
.job .when{font-family:var(--f-mono);font-size:13px;color:var(--sub);white-space:nowrap;text-align:right}
.job ul{grid-column:1/-1;margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:78ch}
.earlier{display:flex;flex-direction:column;gap:8px;font-size:15px}
.earlier b{font-weight:600}
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pj{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
a.pj:hover{border-color:var(--cobalt)}
.pj h3{font-size:20px;font-stretch:108%}
.pj p{color:var(--sub);font-size:15px}
.pj .go{font-family:var(--f-mono);font-size:12.5px;color:var(--cobalt);margin-top:auto;word-break:break-all}
.pj.feat{grid-column:1/-1;border-color:var(--cobalt);background:linear-gradient(var(--cobalt-wash),var(--cobalt-wash)) top/100% 4px no-repeat,var(--sheet)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.li:last-child{border-bottom:0}
.li b{font-weight:600}
.li span.s{color:var(--sub)}
.li .d{font-family:var(--f-mono);font-size:13px;color:var(--sub);white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.contact{display:flex;flex-direction:column;gap:14px}
.mail{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mail code{font-family:var(--f-mono);font-size:15px;background:var(--sheet);border:1px solid var(--rule);padding:8px 12px;border-radius:4px;user-select:all}
footer{padding-block:28px 40px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--sub);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:860px){
  nav.links{display:none}
  .lang{margin-left:auto}
  .hero{grid-template-columns:minmax(0,1fr);padding-top:36px}
  section.sec{grid-template-columns:minmax(0,1fr);gap:18px}
  .skills,.projects,.cols{grid-template-columns:minmax(0,1fr)}
  .job{grid-template-columns:minmax(0,1fr)}
  .job .when{text-align:left}

@media print{header.top{display:none}}
</style>
</head>

    <p class="role">${esc(t.role)}</p>
    <p class="summary">${esc(t.summary)}</p>
    <div class="cta"><a class="btn" href="${t.cvFile}" download>${t.cv}</a><a class="btn ghost" href="${LI}" target="_blank" rel="noopener">LinkedIn</a><a class="btn ghost" href="${GH}" target="_blank" rel="noopener">GitHub</a></div>
  </div>
  <aside class="status" aria-label="Status"><div class="bar"><span class="dot"></span>${t.status}</div><dl>${t.st.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></aside></div>
  ${sec("sobre", t.h.sobre, `<div style="display:flex;flex-direction:column;gap:14px;max-width:68ch">${t.about.map(p => `<p>${esc(p)}</p>`).join("")}</div>`)}
  ${sec("competencias", t.h.competencias, `<div class="skills">${t.skills.map(([g, l]) => `<div><h3>${esc(g)}</h3><div class="tags">${l.map(x => `<span>${esc(x)}</span>`).join("")}</div></div>`).join("")}</div>`)}
  ${sec("experiencia", t.h.experiencia, t.jobs.map(j => `<div class="job"><div><h3>${esc(j.r)}</h3><span class="org">${esc(j.o)}</span></div><span class="when">${esc(j.w)}</span><ul>${j.b.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("") + `<div class="earlier"><span class="lbl">${t.earlierT}</span>${t.earlier.map(([r, d]) => `<p><b>${esc(r)}</b> · ${esc(d)}</p>`).join("")}</div>`)}
  ${sec("projetos", t.h.projetos, `<div class="projects">${t.projects.map(p => `<a class="pj ${p.feat ? "feat" : ""}" href="${p.u}" target="_blank" rel="noopener"><h3>${esc(p.n)}</h3><p>${esc(p.d)}</p><span class="go">${esc(p.t)} →</span></a>`).join("")}</div>`)}
  ${sec("certificacoes", t.h.certificacoes, `<div class="cols"><div class="list">${t.certs.map(([n, o, d]) => `<div class="li"><span><b>${esc(n)}</b><br><span class="s">${esc(o)}</span></span><span class="d">${d}</span></div>`).join("")}</div>
    <div style="display:flex;flex-direction:column;gap:22px"><div><span class="lbl">${t.h.formacao}</span><div class="list">${t.edu.map(([n, o, d]) => `<div class="li"><span><b>${esc(n)}</b><br><span class="s">${esc(o)}</span></span><span class="d">${d}</span></div>`).join("")}</div></div>
    <div><span class="lbl">${t.coursesT}</span><p class="s" style="color:var(--sub);font-size:15px;margin-top:8px">${esc(t.courses)}</p></div></div></div>`)}
  ${sec("contato", t.h.contato, `<div class="contact"><p style="max-width:62ch">${esc(t.contactP)}</p><div class="mail"><code id="mail">${EMAIL}</code><button class="btn ghost" id="copy" type="button">${t.copy}</button></div><div class="cta" style="margin-top:0"><a class="btn" href="${LI}" target="_blank" rel="noopener">LinkedIn</a><a class="btn ghost" href="${GH}" target="_blank" rel="noopener">GitHub</a><a class="btn ghost" href="${t.cvFile}" download>${t.cv}</a></div></div>`)}`;
  document.getElementById("foot").innerHTML = `<span>© 2026 Mateus Corcini</span><span>${t.foot}</span>`;
  document.getElementById("copy").onclick = async (e) => {
    try { await navigator.clipboard.writeText(EMAIL); e.target.textContent = t.copied; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById("mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  };
}
let lang = "pt";
try { lang = localStorage.getItem("lang") || ((navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en"); } catch (e) {}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("lang", lang); } catch (e) {} render(lang); });
render(lang);
</script>
</body>
</html>
